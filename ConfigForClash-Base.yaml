# ===================================================================
# Clash 基础配置模板（配合 ConfigForClash-ACL4SSR.ini 使用）
# 作用：subconverter 转换时把这段"基础设置"合并进最终配置
# 说明：这里只放 端口 / DNS / 通用开关，不放 proxies、proxy-groups、rules
#       （节点、策略组、规则由 subconverter 根据订阅和 ini 自动生成）
# 来源：复刻自当前正在使用的那份可乐云订阅配置
# ===================================================================

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
tcp-concurrent: true
external-controller: '127.0.0.1:9090'

# ===================================================================
# DNS
# 注意：nameserver-policy 里的 sys-metric-report.com 段与 madns-*.site
#       是「可乐云」专用的节点域名解析通道，换机场后应删除这些条目，
#       否则节点域名可能解析失败。
# ===================================================================
dns:
  ipv6: false
  enable: true
  listen: '0.0.0.0:1053'
  use-hosts: true
  default-nameserver: [223.5.5.5, 223.6.6.6, 119.29.29.29, 119.28.28.28, 180.76.76.76, 8.8.8.8]
  nameserver:
    - 'https://223.5.5.5/dns-query'
    - 'https://koala.madns-lemon.site:2443/dns-query'
    - 'https://whale.madns-peach.site:2443/dns-query'
