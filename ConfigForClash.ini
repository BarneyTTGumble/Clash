# ===================================================================
# subconverter 自定义规则配置（单文件整合版）
# 源文件：ConfigForClash250903.yaml（MetaCubeX/mihomo 完整配置）
# 整合内容：base.yaml（端口/DNS/TUN/sniffer）+ ini（策略组/规则集）
# 优势：只需推一个 ini 文件到 GitHub，subconverter 直接读它即可
# ===================================================================
# 使用方法（把本文件推到 GitHub 后，获取 raw 链接，例如：
#   https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash.ini
# subconverter 转换链接拼法（以 api.dler.io 为例）：
#   Clash Meta(mihomo)：
#     https://api.dler.io/sub?target=clashmeta&url=<你的机场订阅链接>&config=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash.ini
#   Clash（旧版 Clash Premium）：
#     https://api.dler.io/sub?target=clash&url=<你的机场订阅链接>&config=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash.ini
#   Shadowrocket：
#     https://api.dler.io/sub?target=shadowrocket&url=<你的机场订阅链接>&config=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash.ini
#   Surge 4：
#     https://api.dler.io/sub?target=surge&ver=4&url=<你的机场订阅链接>&config=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash.ini
# 备注：<你的机场订阅链接> 需要 URL 编码后拼到 url= 后面
# ===================================================================

[custom]
; ---------- 基础开关 ----------
success_http_code=200
clast_meta=true
add_emoji=false
remove_rule_emoji=false
enable_rule=true
clash_meta=true
; 这里不指定 clash_rule_base，改用下面的 [clash_rule_base] 段直接内联基楚配置
; clash_rule_base=

; ---------- 分流策略组（对应原 yaml 的 proxy-groups） ----------
; 语法：custom_proxy_group=组名`策略类型`筛选/显式节点列表
; 策略类型：select / url-test / fallback / load-balance / relay
; 显式节点用半角逗号分隔；筛选语法用 "[]"(全集)、"{}"(正则)、"()"  (地区筛选如 HK/TW/JP/US/SG)
; ---------- 大类速选策略组 ----------
