custom_proxy_group=⚙️ 故障转移`fallback`.*`http://www.gstatic.com/generate_204`600

custom_proxy_group=🎬 NETFLIX`select`[]🔰 节点选择`[]♻️ 自动选择`[]🎯 全球直连`[]⚙️ 故障转移`.*
