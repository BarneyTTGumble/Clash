; ===================================================================
; 规则集：顺序 = 匹配优先级，必须保持
;    类型前缀 clash-classic: 用于 Clash YAML 格式的规则文件
;    [] 前缀表示直接写规则，而不是文件地址
; ===================================================================

; ---- 0. 机场自身域名直连，避免环路（换机场请改这里）----
ruleset=🎯 全球直连,[]DOMAIN,cokecloud.net

; ---- 1. 本仓库自定义直连清单（含 futurbath / opencode 等）----
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/direct.yaml

