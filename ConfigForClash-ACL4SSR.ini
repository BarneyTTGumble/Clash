# ===================================================================
# subconverter 自定义配置：可乐云 + ACL4SSR 全套分流（订阅版）
#
# 目的：把「现在手动导入的那份 yaml」改成「订阅链接」方式使用。
#       节点不进本文件、不进仓库，全部由订阅转换时 url= 指向的机场
#       订阅实时提供，因此订阅更新会自动生效。
#
# 本文件按 tindy2013/subconverter 官方 ini 语法编写：
#   ruleset=策略组名,[类型:]规则URL      类型用 clash-classic: 表示 Clash YAML 规则
#   custom_proxy_group=组名`类型`筛选...   []组名 表示引用策略组，.* 表示全部节点
#   clash_rule_base=基础配置URL          必须是 [custom] 段内的单值键
#
# -------------------------------------------------------------------
# 用法一（推荐）：浏览器/客户端里直接填转换后的订阅链接
#   把下面链接里的 <订阅链接> 换成你的机场订阅地址（含 token，需 URL 编码）
#
#   Clash Meta / mihomo：
#     https://api.dler.io/sub?target=clashmeta&url=<订阅链接>&config=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash-ACL4SSR.ini
#
#   Clash 旧版（Premium）：
#     https://api.dler.io/sub?target=clash&url=<订阅链接>&config=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash-ACL4SSR.ini
#
#   备用转换后端（任选其一，把 api.dler.io 换掉即可）：
#     https://sub.xeton.dev/sub
#     https://api.v1.mk/sub
#     https://sub.id9.cc/sub
#
# 用法二：本地自建 subconverter
#   把本文件与 ConfigForClash-Base.yaml 放到 subconverter 的 profiles/ 目录，
#   clash_rule_base 改为相对路径 ConfigForClash-Base.yaml
# -------------------------------------------------------------------
# 维护记录：本文件修复了旧版 ConfigForClash.ini 的两处语法问题
#   1) 旧版用 rule_set=，subconverter 只认 ruleset=，导致所有规则集被忽略
#   2) 旧版把基础配置写成独立的 [clash_rule_base] 段，subconverter 不读取
#      该段，必须写成 [custom] 里的 clash_rule_base=URL
# ===================================================================

[custom]
; 用本文件的规则集替换订阅自带规则
overwrite_original_rules=true
; 启用 [custom] 段的规则集解析
enable_rule_generator=true
; 基础配置（端口 / DNS）单独成文件，便于修改
clash_rule_base=https://raw.githubusercontent.com/BarneyTTGumble/Clash/main/ConfigForClash-Base.yaml

